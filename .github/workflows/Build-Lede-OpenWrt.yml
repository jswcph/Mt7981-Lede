name: Build Lede-OpenWrt

on:
  schedule:
    # 每周日 22:00 北京时间 = UTC 周日 14:00
    - cron: '0 14 * * 0'
  workflow_dispatch:
    inputs:
      device:
        description: '选择要编译的设备（all = 全部机型）'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - h3c_magic-nx30-pro
          - qihoo_360t7
          - xiaomi_mi-router-ax3000t
          - cmcc_rax3000m-nand
          - cmcc_rax3000me-nand
          - cmcc_rax3000m-emmc
          - netcore_n60
          - netcore_n60-pro
          - xiaomi_mi-router-wr30u
          - abt_asr3000
          - ruijie_rg-x60-pro
          - nokia_ea0326gmp
          - jcg_q30-pro
          - cmcc_xr30-nand
          - cmcc_xr30-emmc
          - xiaomi_redmi-router-ax6000

      repo_url:
        description: '源码仓库地址（默认为 coolsnowwolf/lede，找不到设备可换成 immortalwrt）'
        required: false
        default: 'https://github.com/coolsnowwolf/lede'
      repo_branch:
        description: '源码分支'
        required: false
        default: 'master'

env:
  TZ: Asia/Shanghai

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          INPUT_DEVICE="${{ github.event.inputs.device }}"
          if [ -z "$INPUT_DEVICE" ] || [ "$INPUT_DEVICE" = "all" ]; then
            echo 'matrix={"device":["h3c_magic-nx30-pro","qihoo_360t7","xiaomi_mi-router-ax3000t","cmcc_rax3000m-nand","cmcc_rax3000me-nand","cmcc_rax3000m-emmc","netcore_n60","netcore_n60-pro","xiaomi_mi-router-wr30u","abt_asr3000","ruijie_rg-x60-pro","nokia_ea0326gmp","jcg_q30-pro","cmcc_xr30-nand","cmcc_xr30-emmc","xiaomi_redmi-router-ax6000"]}' >> "$GITHUB_OUTPUT"
          else
            echo "matrix={\"device\":[\"$INPUT_DEVICE\"]}" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    env:
      REPO_URL: ${{ github.event.inputs.repo_url || 'https://github.com/coolsnowwolf/lede' }}
      REPO_BRANCH: ${{ github.event.inputs.repo_branch || 'master' }}
      DEVICE: ${{ matrix.device }}
    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          swap-size-mb: 4096
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          build-mount-path: /mnt/build

      - name: 调整工作目录到扩容分区
        run: |
          sudo mkdir -p /mnt/build/work
          sudo chown $USER:$USER /mnt/build/work
          echo "WORKDIR=/mnt/build/work" >> "$GITHUB_ENV"

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: part1 - 准备编译环境与源码
        run: |
          chmod +x scripts/part1.sh
          cd "$WORKDIR" || true
          bash "$GITHUB_WORKSPACE/scripts/part1.sh"
        env:
          SRC_DIR: ${{ env.WORKDIR }}/openwrt

      - name: part2 - 写入设备与个性化配置
        run: |
          chmod +x scripts/part2.sh
          bash "$GITHUB_WORKSPACE/scripts/part2.sh"
        env:
          SRC_DIR: ${{ env.WORKDIR }}/openwrt

      - name: 下载编译所需依赖包
        run: |
          set -euo pipefail
          cd "$WORKDIR/openwrt"
          make download -j4
          # 删除下载目录中小于 1KB 的文件；不使用 -exec，避免转义问题
          find dl -type f -size -1024c -print -delete

      - name: 开始编译固件
        run: |
          cd "$WORKDIR/openwrt"
          echo "使用 2 线程编译，设备：$DEVICE"
          if ! make -j2 V=sc; then
            echo "2线程编译失败，降级为单线程..."
            make -j1 V=sc
          fi
        timeout-minutes: 300

      - name: 整理固件产物
        run: |
          set -euo pipefail
          SRC="$WORKDIR/openwrt/bin/targets"
          OUT="$GITHUB_WORKSPACE/firmware/${DEVICE}"
          DATE=$(date +'%y%m%d')
          mkdir -p "$OUT"
          test -d "$SRC"

          find "$SRC" -type f \
            \( -iname '*sysupgrade*' -o -iname '*factory*' -o -iname '*.img.gz' \) \
            -print0 |
          while IFS= read -r -d '' file; do
            BASE=$(basename "$file")
            CLEAN_NAME="$BASE"
            case "$BASE" in
              openwrt-*) CLEAN_NAME="${BASE#openwrt-}" ;;
            esac
            case "$CLEAN_NAME" in
              *.img.gz)
                NAME="${CLEAN_NAME%.img.gz}"
                NEW_NAME="Lede-${DEVICE}-${NAME}-${DATE}.img.gz"
                ;;
              *)
                NAME="${CLEAN_NAME%.*}"
                EXT="${CLEAN_NAME##*.}"
                NEW_NAME="Lede-${DEVICE}-${NAME}-${DATE}.${EXT}"
                ;;
            esac
            cp "$file" "$OUT/$NEW_NAME"
            echo "已整理：$NEW_NAME"
          done

          cp "$WORKDIR/openwrt/.config" "$OUT/Lede-${DEVICE}-config-${DATE}.seed" || true
          echo "===== 已收集固件 ====="
          find "$OUT" -maxdepth 1 -type f -printf '%f (%s bytes)\n'

      - name: 上传固件为 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.device }}
          path: firmware/${{ matrix.device }}
          retention-days: 7
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 下载所有固件 Artifact
        uses: actions/download-artifact@v4
        with:
          path: firmware

      - name: 生成 Release 说明
        run: |
          chmod +x scripts/generate-release-notes.sh
          bash scripts/generate-release-notes.sh

      - name: 整理发布文件
        id: meta
        run: |
          set -euo pipefail
          mkdir -p release

          # 使用 -print0 + read，避免 find -exec 的反斜杠转义问题
          find firmware -type f \
            \( -iname '*sysupgrade*' -o -iname '*factory*' -o -iname '*.img.gz' -o -iname '*.seed' \) \
            -print0 |
          while IFS= read -r -d '' file; do
            cp -f "$file" release/
          done

          echo "===== Release 文件列表 ====="
          find release -maxdepth 1 -type f -printf '%f (%s bytes)\n'
          echo "tag=firmware-$(date +'%Y.%m.%d')-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: 发布到 Release 页面
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Lede-OpenWrt构建 ${{ steps.meta.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: release/*
